server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: fpms-backend

  datasource:
    url: jdbc:postgresql://localhost:5434/fpms_db
    username: postgres
    password: postgres_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Cấu hình Swagger OpenAPI UI: http://localhost:8080/api/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
